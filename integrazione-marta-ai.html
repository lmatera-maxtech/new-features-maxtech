<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Integrazione Marta AI · Direct Intelligence → OneForm</title>
<meta name="theme-color" content="#2A1038">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2A1038;
  --plum:#421F59;
  --plum-lift:#4E2769;
  --magenta:#E700E2;
  --orchid:#C43AD5;
  --cream:#EFE9DD;
  --cream-dim:#BEA9C6;
  --hair:rgba(239,233,221,.16);
  --di:#8B6BD6;
  --of:#2E9BFF;
  --of-go:#00BB6D;
  --warn:#F5B942;
  --bad:#FF5C7A;
  --display:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --pad:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--ink);color:var(--cream);
  font-family:var(--body);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.app{
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-columns:minmax(0,1fr);
  height:100dvh;width:100%;max-width:100vw;overflow-x:clip;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

/* ── barra superiore ───────────────────────────────── */
.bar{padding:12px var(--pad) 0;border-bottom:1px solid var(--hair)}
.bar-top{display:flex;align-items:center;gap:10px;margin-bottom:11px;min-width:0}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--magenta);flex:none;
  box-shadow:0 0 0 0 rgba(231,0,226,.6);animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(231,0,226,.55)}70%{box-shadow:0 0 0 9px rgba(231,0,226,0)}100%{box-shadow:0 0 0 0 rgba(231,0,226,0)}}
.bar-title{font-family:var(--display);font-weight:600;font-size:13.5px;letter-spacing:.01em;
  white-space:nowrap;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
.bar-sub{color:var(--cream-dim);font-size:12.5px;margin-left:auto;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.seg{display:flex;gap:4px;padding-bottom:12px}
.seg button{
  flex:1;height:4px;border:0;padding:0;border-radius:2px;cursor:pointer;
  background:rgba(239,233,221,.15);transition:background .3s,transform .2s;
}
.seg button[data-app=di].on{background:var(--di)}
.seg button[data-app=of].on{background:var(--of)}
.seg button.cur{transform:scaleY(2.25)}
.seg button[data-app=di].cur{background:var(--magenta)}
.seg button[data-app=of].cur{background:var(--magenta)}

/* ── mazzo orizzontale ─────────────────────────────── */
.deck{
  display:flex;width:100%;min-width:0;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scroll-behavior:smooth;
  scrollbar-width:none;overscroll-behavior-x:contain;
}
.deck::-webkit-scrollbar{display:none}
.panel{
  flex:0 0 100%;width:100%;height:100%;
  scroll-snap-align:start;scroll-snap-stop:always;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:22px var(--pad) 30px;
}

/* ── copertina ─────────────────────────────────────── */
.cover{display:flex;flex-direction:column;justify-content:center}
.cover h1{
  font-family:var(--display);font-weight:800;
  font-size:clamp(30px,8.4vw,46px);line-height:1.02;letter-spacing:-.028em;
  margin:0 0 14px;max-width:16ch;
}
.cover p{color:var(--cream-dim);max-width:34ch;margin:0 0 26px;font-size:15.5px}
.handoff{display:flex;flex-direction:column;margin:0 0 26px;
  border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.handoff div{padding:14px 16px;min-width:0}
.handoff div+div{border-top:1px solid var(--hair)}
@media (min-width:520px){
  .handoff{flex-direction:row;align-items:stretch}
  .handoff div{flex:1}
  .handoff div+div{border-top:0;border-left:1px solid var(--hair)}
}
.handoff b{display:block;font-family:var(--display);font-weight:600;font-size:14px;margin-bottom:3px}
.handoff span{color:var(--cream-dim);font-size:12.5px;line-height:1.4;display:block}
.handoff .h-di{box-shadow:inset 3px 0 0 var(--di)}
.handoff .h-of{box-shadow:inset 3px 0 0 var(--of)}
@media (min-width:520px){
  .handoff .h-di{box-shadow:inset 0 3px 0 var(--di)}
  .handoff .h-of{box-shadow:inset 0 3px 0 var(--of)}
}
.start{
  display:inline-flex;align-items:center;gap:11px;align-self:flex-start;
  background:var(--magenta);color:#fff;border:0;cursor:pointer;
  font-family:var(--display);font-weight:600;font-size:15px;
  padding:14px 22px;border-radius:100px;transition:transform .16s,filter .16s;
}
.start:hover{filter:brightness(1.08)}
.start:active{transform:scale(.97)}
.hint{color:var(--cream-dim);font-size:12.5px;margin:22px 0 0;max-width:38ch;line-height:1.5}

/* ── testata step ──────────────────────────────────── */
.chip{
  display:inline-flex;align-items:center;gap:7px;
  font-size:11.5px;font-weight:600;letter-spacing:.02em;
  padding:5px 11px 5px 9px;border-radius:100px;margin-bottom:13px;
}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.di{color:#C9B4FF;background:rgba(139,107,214,.17)}
.chip.of{color:#9FD2FF;background:rgba(46,155,255,.15)}
.panel h2{
  font-family:var(--display);font-weight:700;
  font-size:clamp(22px,5.9vw,28px);line-height:1.14;letter-spacing:-.018em;
  margin:0 0 7px;max-width:22ch;
}
.lede{color:var(--cream-dim);margin:0 0 18px;max-width:44ch;font-size:14.5px}

/* ── screenshot + puntatori ────────────────────────── */
.shot{
  position:relative;border-radius:12px;overflow:hidden;
  background:#fff;border:1px solid var(--hair);
  margin:0 0 8px;cursor:zoom-in;
}
.shot img{display:block;width:100%;height:auto}
.shot::after{
  content:"";position:absolute;inset:0;background:var(--ink);
  transform-origin:right;transition:transform .62s cubic-bezier(.22,.8,.2,1);
}
.panel.live .shot::after{transform:scaleX(0)}
.hot{position:absolute;transform:translate(-50%,-50%);pointer-events:none;
  border-radius:6px;opacity:0;}
.panel.live .hot{animation:mark .5s .52s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes mark{from{opacity:0;transform:translate(-50%,-50%) scale(1.14)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.hot.act{box-shadow:0 0 0 2.5px var(--magenta),0 0 0 5px rgba(231,0,226,.22)}
.hot.alt{box-shadow:0 0 0 2px var(--orchid),0 0 0 4px rgba(196,58,213,.18)}
.hot.note{box-shadow:0 0 0 2px rgba(42,16,56,.8),0 0 0 3.5px rgba(255,255,255,.5);border-radius:8px}
.hot b{
  position:absolute;top:-11px;left:-11px;
  width:19px;height:19px;border-radius:50%;
  font-family:var(--display);font-weight:800;font-size:11px;line-height:19px;
  text-align:center;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);
}
.hot.act b{background:var(--magenta)}
.hot.alt b{background:var(--orchid)}
.panel.live .hot.alt{animation-delay:.68s}
.panel.live .hot.note{animation-delay:.36s}
.shot-cap{margin:0 0 22px;font-size:12.5px;color:var(--cream-dim);line-height:1.5}
.shot-cap b{color:var(--cream);font-weight:600}
.shot-cap i{display:inline-block;width:8px;height:8px;border-radius:2px;
  box-shadow:0 0 0 2px var(--magenta);margin-right:7px;vertical-align:1px}

/* ── corpo testo ───────────────────────────────────── */
.sec{margin:0 0 20px}
.sec > h3{
  font-family:var(--body);font-weight:600;font-size:12.5px;color:var(--cream-dim);
  margin:0 0 9px;padding-bottom:7px;border-bottom:1px solid var(--hair);
}
.sec p{margin:0 0 9px;max-width:46ch}
.sec p:last-child{margin-bottom:0}
.sec code{
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:12.5px;
  background:rgba(196,58,213,.16);color:#F0BFF4;padding:1.5px 5px;border-radius:4px;
  white-space:nowrap;
}
.facts{list-style:none;margin:0;padding:0}
.facts li{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:14px}
.facts li:last-child{border-bottom:0}
.facts span{color:var(--cream-dim);flex:0 0 40%;max-width:150px}
.facts b{font-weight:500}

/* ── diramazioni ───────────────────────────────────── */
.branch{border:1px solid var(--hair);border-radius:11px;overflow:hidden;margin-bottom:9px}
.branch summary{
  display:flex;align-items:center;gap:11px;cursor:pointer;list-style:none;
  padding:13px 14px;font-family:var(--display);font-weight:600;font-size:14.5px;
  transition:background .18s;
}
.branch summary::-webkit-details-marker{display:none}
.branch summary:hover{background:var(--plum)}
.branch summary i{
  width:19px;height:19px;border-radius:50%;flex:none;
  font-family:var(--display);font-weight:800;font-size:11px;font-style:normal;
  line-height:19px;text-align:center;color:#fff;background:var(--orchid);
}
.branch[data-kind=go] summary i{background:var(--magenta)}
.branch[data-kind=stop] summary i{background:transparent;color:var(--bad);
  box-shadow:inset 0 0 0 2px var(--bad)}
.branch[data-kind=warn] summary i{background:var(--orchid)}
.branch summary .caret{margin-left:auto;color:var(--cream-dim);font-size:11px;transition:transform .2s}
.branch[open] summary .caret{transform:rotate(90deg)}
.branch-body{padding:0 14px 14px;border-top:1px solid var(--hair);margin-top:-1px}
.branch-body p{margin:12px 0 0;color:var(--cream-dim);font-size:14px;max-width:44ch}
.jump{
  display:inline-flex;align-items:center;gap:8px;margin:13px 8px 0 0;
  background:transparent;color:var(--magenta);border:1px solid var(--magenta);
  font-family:var(--display);font-weight:600;font-size:13px;
  padding:8px 15px;border-radius:100px;cursor:pointer;transition:background .16s,color .16s;
}
.jump:hover{background:var(--magenta);color:#fff}

/* ── navigazione ───────────────────────────────────── */
.nav{
  display:flex;align-items:center;gap:14px;min-width:0;
  padding:11px var(--pad);border-top:1px solid var(--hair);background:var(--ink);
}
.nav button{
  width:40px;height:40px;flex:none;border-radius:50%;cursor:pointer;
  background:var(--plum);border:1px solid var(--hair);color:var(--cream);
  font-size:15px;display:grid;place-items:center;transition:background .16s,opacity .16s;
}
.nav button:hover:not(:disabled){background:var(--plum-lift)}
.nav button:disabled{opacity:.3;cursor:default}
.count{font-family:var(--display);font-weight:600;font-size:13px;color:var(--cream-dim)}
.count b{color:var(--cream);font-weight:800}
.nav .label{
  margin-left:auto;text-align:right;font-size:12.5px;color:var(--cream-dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ── lightbox ──────────────────────────────────────── */
.lb{
  position:fixed;inset:0;z-index:50;background:rgba(20,6,28,.94);
  display:none;overflow:auto;padding:56px 10px 24px;
  -webkit-overflow-scrolling:touch;
}
.lb.on{display:block}
.lb img{display:block;width:100%;max-width:1100px;margin:0 auto;border-radius:8px}
.lb-x{
  position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:14px;
  width:40px;height:40px;border-radius:50%;border:1px solid var(--hair);
  background:var(--plum);color:var(--cream);font-size:17px;cursor:pointer;
  display:grid;place-items:center;
}

:focus-visible{outline:2px solid var(--magenta);outline-offset:3px;border-radius:4px}

@media (min-width:760px){
  :root{--pad:44px}
  .panel{padding:34px var(--pad) 40px;display:grid;
    grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
    grid-template-areas:"head text" "shot text";
    align-content:start;column-gap:44px;row-gap:0;}
  .panel.cover{display:flex}
  .p-head{grid-area:head}
  .p-shot{grid-area:shot}
  .p-text{grid-area:text;padding-top:2px}
  .shot{width:fit-content;max-width:100%}
  .shot img{width:auto;max-width:100%;max-height:62vh}
  .panel h2{font-size:31px;max-width:24ch}
  .lede{max-width:52ch}
  .cover h1{font-size:60px;max-width:19ch}
  .cover > *{max-width:760px}
  .bar-sub{max-width:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;
    transition-duration:.001s!important}
  .deck{scroll-behavior:auto}
  .shot::after{display:none}
  .hot{opacity:1;transform:translate(-50%,-50%)}
}
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="bar-top">
      <span class="pulse" aria-hidden="true"></span>
      <span class="bar-title">Integrazione Marta AI</span>
      <span class="bar-sub" id="barSub">Supermoney Energia</span>
    </div>
    <div class="seg" id="seg" role="tablist" aria-label="Step del flusso"></div>
  </header>

  <div class="deck" id="deck"></div>

  <nav class="nav">
    <button id="prev" aria-label="Step precedente">&#8249;</button>
    <button id="next" aria-label="Step successivo">&#8250;</button>
    <span class="count"><b id="cur">—</b> / <span id="tot">—</span></span>
    <span class="label" id="navLabel"></span>
  </nav>
</div>

<div class="lb" id="lb">
  <button class="lb-x" id="lbX" aria-label="Chiudi">&#10005;</button>
  <img id="lbImg" alt="">
</div>

/* ─── rendering ───────────────────────────────────── */
const deck = document.getElementById('deck');
const seg  = document.getElementById('seg');

deck.insertAdjacentHTML('beforeend', `
  <section class="panel cover" id="p0">
    <h1>Flusso inbound Energia con Marta AI</h1>
    <p>Dal trasferimento della chiamata da Marta all’operatore fino alla creazione del contratto su OneForm. Nove step, con le opzioni disponibili in ciascuno.</p>
    <div class="handoff">
      <div class="h-di"><b>Direct Intelligence</b><span>Step 1–3 · trasferimento della chiamata e presa in carico</span></div>
      <div class="h-of"><b>OneForm</b><span>Step 4–9 · catalogo offerte, completamento dati e controlli</span></div>
    </div>
    <button class="start" id="startBtn">Vai allo step 1 &#8250;</button>
    <p class="hint">Scorri con il dito o usa le frecce per cambiare step. Tocca uno screenshot per ingrandirlo.</p>
  </section>`);

FLOW.forEach(s => {
  const hots = (s.hots||[]).map(h => `
    <span class="hot ${h.kind}" style="left:${h.x}%;top:${h.y}%;width:${h.w}%;height:${h.h}%">
      ${h.ref ? `<b>${h.ref}</b>` : ''}
    </span>`).join('');

  const cap = `${s.cap.act ? `<i></i><b>${s.cap.act}</b> — ` : ''}${s.cap.ctx}`;

  const body = (s.body||[]).map(b => {
    const inner = b.facts
      ? `<ul class="facts">${b.facts.map(f=>`<li><span>${f[0]}</span><b>${f[1]}</b></li>`).join('')}</ul>`
      : b.p.map(t=>`<p>${t}</p>`).join('');
    return `<div class="sec"><h3>${b.h}</h3>${inner}</div>`;
  }).join('');

  const branches = (s.branches||[]).map((b,k) => `
    <details class="branch" data-kind="${b.kind}">
      <summary><i>${k+1}</i>${b.label}<span class="caret">&#9656;</span></summary>
      <div class="branch-body">
        <p>${b.p}</p>
        ${b.to ? [].concat(b.to).map(t=>`<button class="jump" data-to="${t}">Vai allo step ${t} &#8250;</button>`).join('') : ''}
      </div>
    </details>`).join('');

  deck.insertAdjacentHTML('beforeend', `
    <section class="panel step" id="p${s.n}" data-n="${s.n}">
      <div class="p-head">
        <span class="chip ${s.app}"><i></i>${s.appName}</span>
        <h2>${s.title}</h2>
        <p class="lede">${s.lede}</p>
      </div>
      <div class="p-shot">
        <div class="shot" data-img="${s.img}" role="button" tabindex="0"
             aria-label="Ingrandisci lo screenshot dello step ${s.n}">
          <img src="${IMG[s.img]}" alt="Step ${s.n}: ${s.title}" loading="lazy">
          ${hots}
        </div>
        <p class="shot-cap">${cap}</p>
      </div>
      <div class="p-text">
        ${body}
        <div class="sec"><h3>Opzioni disponibili</h3>${branches}</div>
      </div>
    </section>`);

  seg.insertAdjacentHTML('beforeend',
    `<button data-app="${s.app}" data-go="${s.n}" role="tab"
             aria-label="Step ${s.n}: ${s.title}"></button>`);
});

/* ─── navigazione ─────────────────────────────────── */
const panels = [...deck.querySelectorAll('.panel')];
const segs   = [...seg.querySelectorAll('button')];
const prevB  = document.getElementById('prev');
const nextB  = document.getElementById('next');
const curEl  = document.getElementById('cur');
const navLab = document.getElementById('navLabel');
const barSub = document.getElementById('barSub');
let idx = 0;

function goTo(i, smooth = true){
  i = Math.max(0, Math.min(panels.length-1, i));
  deck.scrollTo({left: i * deck.clientWidth, behavior: smooth ? 'smooth' : 'auto'});
}

function paint(i){
  idx = i;
  panels.forEach((p,k)=>p.classList.toggle('live', k===i));
  segs.forEach((b,k)=>{
    b.classList.toggle('on',  k <= i-1);
    b.classList.toggle('cur', k === i-1);
  });
  const s = FLOW[i-1];
  curEl.textContent = i === 0 ? '—' : String(i).padStart(2,'0');
  navLab.textContent = s ? s.title : 'Panoramica';
  barSub.textContent = s ? s.appName : 'Supermoney Energia';
  prevB.disabled = i === 0;
  nextB.disabled = i === panels.length-1;
}

const io = new IntersectionObserver(es=>{
  es.forEach(e=>{
    if(e.isIntersecting && e.intersectionRatio > .55){
      paint(panels.indexOf(e.target));
    }
  });
}, {root: deck, threshold:[.55]});
panels.forEach(p=>io.observe(p));

prevB.onclick = ()=>goTo(idx-1);
nextB.onclick = ()=>goTo(idx+1);
document.getElementById('startBtn').onclick = ()=>goTo(1);
seg.addEventListener('click', e=>{
  const b = e.target.closest('button[data-go]');
  if(b) goTo(+b.dataset.go);
});
deck.addEventListener('click', e=>{
  const j = e.target.closest('.jump');
  if(j) goTo(+j.dataset.to);
});
addEventListener('keydown', e=>{
  if(document.getElementById('lb').classList.contains('on')){
    if(e.key === 'Escape') closeLb();
    return;
  }
  if(e.key === 'ArrowRight'){ e.preventDefault(); goTo(idx+1); }
  if(e.key === 'ArrowLeft'){  e.preventDefault(); goTo(idx-1); }
});
addEventListener('resize', ()=>goTo(idx, false));

/* ─── lightbox ────────────────────────────────────── */
const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg');
function openLb(key, alt){
  lbImg.src = IMG[key]; lbImg.alt = alt || '';
  lb.classList.add('on'); lb.scrollTop = 0;
}
function closeLb(){ lb.classList.remove('on'); }
deck.addEventListener('click', e=>{
  const s = e.target.closest('.shot');
  if(s) openLb(s.dataset.img, s.querySelector('img').alt);
});
deck.addEventListener('keydown', e=>{
  const s = e.target.closest('.shot');
  if(s && (e.key === 'Enter' || e.key === ' ')){
    e.preventDefault(); openLb(s.dataset.img, s.querySelector('img').alt);
  }
});
document.getElementById('lbX').onclick = closeLb;
lb.addEventListener('click', e=>{ if(e.target === lb) closeLb(); });

document.getElementById('tot').textContent = FLOW.length;
paint(0);
</script>
